services:
  api:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - docmind_data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  docmind_data:
